<style>

<body>
<header class="top">
  <div class="brand"><div class="logo">MP</div><div><h1>Monitoreo de Producción</h1><small id="sub">Fabricación de moldes de yeso</small></div></div>
  <div class="topR"><button class="btn hd" data-a="xls">⬇ Excel</button><span id="sync" class="chip">Solo local</span></div>
</header>
<nav id="tabs"></nav>
<main id="main"></main>
<div id="modal" class="modal" hidden></div>
<div id="toast"></div>
<input type="file" id="impFile" accept=".json,application/json" hidden>
<script>
(function(){
'use strict';
var LS='monitoreoProd_v1',LSU='monitoreoProd_ui',LSS='monitoreoProd_sync';
var DIAS=['DOMINGO','LUNES','MARTES','MIÉRCOLES','JUEVES','VIERNES','SÁBADO'],DC=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'],MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
function $(s){return document.querySelector(s)}
function pad(n){return String(n).padStart(2,'0')}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function num(v){var n=parseFloat(String(v==null?'':v).replace(',','.'));return isFinite(n)?n:0}
function fmt(n,d){d=d||0;return (isFinite(n)?n:0).toLocaleString('es-MX',{minimumFractionDigits:d,maximumFractionDigits:d})}
function uid(){return Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4)}
function today(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function pd(s){var a=String(s).split('-').map(Number);return new Date(Date.UTC(a[0],(a[1]||1)-1,a[2]||1))}
function ymd(d){return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate())}
function addD(s,n){var d=pd(s);d.setUTCDate(d.getUTCDate()+n);return ymd(d)}
function dow(s){return pd(s).getUTCDay()}
function wkStart(s){return addD(s,-((dow(s)+6)%7))}
function diffDays(a,b){return Math.round((pd(b)-pd(a))/864e5)}
function fdate(s){return s?s.slice(8,10)+'/'+s.slice(5,7)+'/'+s.slice(0,4):'—'}
function fdm(s){return (+s.slice(8,10))+'-'+MES[+s.slice(5,7)-1]}
function pctTxt(p){return p==null?'—':fmt(p*100,1)+'%'}
function pctCls(p){return p==null?'c-mut':p>=0.95?'c-ok':p>=0.85?'c-warn':'c-bad'}
function pctCol(p){return p==null?'#c9c4b8':p>=0.95?'#2f8f6b':p>=0.85?'#c98a12':'#c2410c'}

/* ================= DATOS ================= */
var MODS=[['Taza gen3 redonda','taza'],['Taza Alargada Gen 3','taza'],['Taza Gen 3 SP','taza'],['Taza Maxwell Std','taza'],['Taza Ada','taza'],['Anillo Generacion 3 Red.','anillo'],['Anillo Alargado Gen 3','anillo'],['Anillo Alargado Gen 3 SP','anillo'],['Anillo Maxell ada','anillo'],['Anillo Banner','anillo'],['Anillo Maxell Std','anillo'],['Tanque DF Alargado','tanque'],['Tanque Maxwell','tanque'],['Tapon noria','otro'],['Refacciones','otro'],['Placas porvair','otro'],['placas unimak','otro']];
var INV=['ALARGADA','REDONDA','ESTÁNDAR','MAXWELL ADA','BANNER','SPAGLESS'];
function blank(){return {v:1,updatedAt:0,config:{te:50,disp:1290,contarSinPlan:false,area:'Fabricación de moldes de yeso'},
  modelos:MODS.map(function(m,i){return {id:'m'+(i+1),nombre:m[0],tipo:m[1]}}),
  prod:{},notas:{},seguridad:{ultimo:''},yeso:{area:'',almacen:'',porLlegar:'',unidad:'t',fecha:''},
  moldes:{fecha:'',items:INV.map(function(n,i){return {id:'i'+(i+1),nombre:n,secado:'',listo:'',porBanca:37}})}}}
function seed(o){ /* datos de la semana del 23-nov-2026 tomados de la tabla de Ignacio */
  var D={'2026-11-23':{p:{m1:10,m3:12,m5:12,m6:14,m8:8,m9:24,m11:10,m15:0},a:{m1:6,m3:7,m5:10,m9:9,m11:10,m15:3},b:{m3:6,m6:10,m8:8,m9:10,m11:3,m15:2},buenos:15},
    '2026-11-24':{p:{m3:12,m5:12,m6:24,m8:18,m9:24},a:{m3:6,m5:12,m6:10,m8:9,m9:10},b:{m3:6,m6:14,m8:9,m9:14}},
    '2026-11-25':{p:{m3:12,m5:12,m6:24,m8:18,m9:24},a:{m3:6,m5:12,m6:10,m8:9,m9:10},b:{m3:6,m6:14,m8:9,m9:14}},
    '2026-11-26':{p:{m1:10,m3:6,m5:26,m6:14,m9:14},a:{m1:10,m3:6,m5:12},b:{m5:14,m6:14,m9:14}},
    '2026-11-27':{te:true,p:{},a:{},b:{}},'2026-11-28':{te:true,p:{},a:{},b:{}}};
  o.prod=D;return o}
function norm(o){var b=blank();o.config=Object.assign(b.config,o.config||{});['modelos'].forEach(function(k){if(!Array.isArray(o[k]))o[k]=o[k]?Object.keys(o[k]).map(function(x){return o[k][x]}):b[k];o[k]=o[k].filter(Boolean)});
  o.prod=o.prod||{};o.notas=o.notas||{};o.seguridad=Object.assign(b.seguridad,o.seguridad||{});o.yeso=Object.assign(b.yeso,o.yeso||{});
  o.moldes=o.moldes||b.moldes;if(!Array.isArray(o.moldes.items))o.moldes.items=o.moldes.items?Object.keys(o.moldes.items).map(function(x){return o.moldes.items[x]}):b.moldes.items;o.moldes.items=o.moldes.items.filter(Boolean);
  Object.keys(o.prod).forEach(function(d){var x=o.prod[d]||{};x.p=x.p||{};x.a=x.a||{};x.b=x.b||{};x.ra=x.ra||{};x.rb=x.rb||{};o.prod[d]=x});return o}
function load(){try{var r=localStorage.getItem(LS);if(r){var o=JSON.parse(r);if(o&&o.modelos)return norm(o)}}catch(e){}return seed(blank())}
var S=load();
var UI=(function(){var t=today(),d={tab:'junta',week:wkStart(t),day:t};try{var u=JSON.parse(localStorage.getItem(LSU));if(u)d=Object.assign(d,u)}catch(e){}return d})();
function saveUI(){try{localStorage.setItem(LSU,JSON.stringify(UI))}catch(e){}}
function save(noSync){S.updatedAt=Date.now();try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){toast('No se pudo guardar en este navegador')}if(!noSync)Sync.push()}

/* ================= CÁLCULOS ================= */
function weekDays(w){var o=[];for(var i=0;i<6;i++)o.push(addD(w,i));return o}
function dd(d){var x=S.prod[d]||{};x.p=x.p||{};x.a=x.a||{};x.b=x.b||{};x.ra=x.ra||{};x.rb=x.rb||{};return x}
function cell(d,k,id){var x=dd(d)[k];var v=x?x[id]:undefined;return v===undefined||v===null||v===''?'':v}
function mDay(x,id){var pv=x.p[id],pe=pv===undefined||pv===null||pv==='',p=num(pv),a=num(x.a[id]),b=num(x.b[id]),ra=num(x.ra[id]),rb=num(x.rb[id]);if(!pe&&p<=0){a=0;b=0}var pt=pe?a+b:p;return {p:pt,a:a,b:b,ra:ra,rb:rb,con:pt>0}}
function dayStats(d){var x=dd(d),r={d:d,te:!!x.te,plan:0,pg1:0,pg2:0,g1:0,g2:0,g1All:0,g2All:0,sinPlan:[]};
  S.modelos.forEach(function(m){var q=mDay(x,m.id);r.plan+=q.p;r.pg1+=q.a;r.pg2+=q.b;r.g1All+=q.ra;r.g2All+=q.rb;
    if(q.con||S.config.contarSinPlan){r.g1+=q.ra;r.g2+=q.rb}if(!q.con&&q.ra+q.rb>0)r.sinPlan.push({n:m.nombre,q:q.ra+q.rb})});
  r.real=r.g1+r.g2;r.realAll=r.g1All+r.g2All;r.dif=r.real-r.plan;r.pct=r.plan>0?r.real/r.plan:null;r.pct1=r.pg1>0?r.g1/r.pg1:null;r.pct2=r.pg2>0?r.g2/r.pg2:null;
  r.hasData=r.plan>0||r.realAll>0;r.buenos=x.buenos;r.efi=efic(x);return r}
function efic(x){var b=num(x&&x.buenos),te=num(x&&x.te2!=null&&x.te2!==''?x.te2:S.config.te),di=num(x&&x.disp!=null&&x.disp!==''?x.disp:S.config.disp);return (x&&x.buenos!==undefined&&x.buenos!==''&&di>0)?b*te/di:null}
function weekStats(w){var ds=weekDays(w).map(dayStats),r={days:ds,plan:0,pg1:0,pg2:0,real:0,g1:0,g2:0,realAll:0,sinPlan:{}};
  ds.forEach(function(x){r.plan+=x.plan;r.pg1+=x.pg1;r.pg2+=x.pg2;r.real+=x.real;r.g1+=x.g1;r.g2+=x.g2;r.realAll+=x.realAll;x.sinPlan.forEach(function(s){r.sinPlan[s.n]=(r.sinPlan[s.n]||0)+s.q})});
  r.pct=r.plan>0?r.real/r.plan:null;r.pct1=r.pg1>0?r.g1/r.pg1:null;r.pct2=r.pg2>0?r.g2/r.pg2:null;r.dif=r.real-r.plan;return r}
function modelWeek(w,m){var r={plan:0,pg1:0,pg2:0,g1:0,g2:0,sin:0};weekDays(w).forEach(function(d){var q=mDay(dd(d),m.id);r.plan+=q.p;r.pg1+=q.a;r.pg2+=q.b;if(q.con||S.config.contarSinPlan){r.g1+=q.ra;r.g2+=q.rb}else r.sin+=q.ra+q.rb});r.real=r.g1+r.g2;r.dif=r.real-r.plan;r.pct=r.plan?r.real/r.plan:null;return r}
function diasSin(){var u=S.seguridad.ultimo;if(!u)return null;return Math.max(0,diffDays(u,today()))}
function refDay(w){var t=today(),ds=weekDays(w);if(ds.indexOf(t)>=0){var y=addD(t,-1);var cand=[t];if(ds.indexOf(y)>=0)cand.unshift(y);for(var i=cand.length-1;i>=0;i--){if(dayStats(cand[i]).hasData)return cand[i]}return t}for(var j=ds.length-1;j>=0;j--)if(dayStats(ds[j]).hasData)return ds[j];return ds[0]}
function efDay(w){var t=today(),e=weekDays(w).filter(function(q){return q<=t&&dd(q).buenos!==undefined&&dd(q).buenos!==''});return e.length?e[e.length-1]:refDay(w)}

function dayChart(ws){var W=480,H=220,L=36,R=6,T=12,B=26,ih=H-T-B,iw=W-L-R,max=1;ws.days.forEach(function(r){max=Math.max(max,r.plan,r.real)});var st=max<=20?5:max<=60?10:max<=120?20:50;max=Math.ceil(max/st)*st;

var CRC=(function(){var t=new Uint32Array(256);for(var n=0;n<256;n++){var c=n;for(var k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(d){var c=0xFFFFFFFF;for(var i=0;i<d.length;i++)c=CRC[(c^d[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0}
function zip(files){var enc=new TextEncoder(),parts=[],cen=[],off=0,now=new Date(),dt=((now.getFullYear()-1980)<<9)|((now.getMonth()+1)<<5)|now.getDate(),tm=(now.getHours()<<11)|(now.getMinutes()<<5)|(now.getSeconds()>>1);
  files.forEach(function(f){var nm=enc.encode(f.name),d=f.data,c=crc32(d),h=new DataView(new ArrayBuffer(30));
    h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(8,0,true);h.setUint16(10,tm,true);h.setUint16(12,dt,true);h.setUint32(14,c,true);h.setUint32(18,d.length,true);h.setUint32(22,d.length,true);h.setUint16(26,nm.length,true);h.setUint16(28,0,true);
    parts.push(new Uint8Array(h.buffer),nm,d);
